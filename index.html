
<section style="padding:40px 20px;text-align:center;">
  <h2 style="font-size:48px;font-weight:800;color:#111;margin-bottom:30px;">
    Apply For Loan
  </h2>

  <form style="max-width:400px;margin:auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,0.1);">

    <input type="text" id="name" placeholder="Full Name" required
    style="width:100%;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #ccc;font-size:16px;">

    <input type="tel" id="mobile" placeholder="Mobile Number" required
    style="width:100%;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #ccc;font-size:16px;">

    <input type="text" id="loan" placeholder="Loan Type" required
    style="width:100%;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #ccc;font-size:16px;">

    <input type="text" id="city" placeholder="City" required
    style="width:100%;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #ccc;font-size:16px;">

    <input type="text" id="income" placeholder="Monthly Income" required
    style="width:100%;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #ccc;font-size:16px;">

    <button type="button" onclick="sendWhatsapp()"
    style="width:100%;padding:15px;background:#1e40ff;color:white;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px;">
      Apply Now
    </button>

  </form>
</section>

<script>
function sendWhatsapp() {

let name = document.getElementById("name").value;
let mobile = document.getElementById("mobile").value;
let loan = document.getElementById("loan").value;
let city = document.getElementById("city").value;
let income = document.getElementById("income").value;

let message =
"🏦 *New Loan Application* %0A%0A" +
"👤 Name: " + name + "%0A" +
"📱 Mobile: " + mobile + "%0A" +
"💰 Loan Type: " + loan + "%0A" +
"📍 City: " + city + "%0A" +
"💵 Monthly Income: " + income;

window.open("https://wa.me/919542359321?text=" + message, "_blank");
}
</script>
